name: kafka
version: 0.1.0
dsl_version: 3
backend: http
description: >-
  Query clusters, brokers, topics, partitions, consumer groups, and consumer
  offsets from Apache Kafka via the Kafka UI REST API (self-hosted).

inputs:
  KAFKA_UI_URL:
    kind: variable
    hint: |
      Base URL of your Kafka UI instance, for example `http://localhost:8080`.
      Kafka UI exposes a REST API that Coral uses to query cluster metadata.
      See https://github.com/provectus/kafka-ui for setup instructions.

base_url: "{{input.KAFKA_UI_URL}}"

test_queries:
  - SELECT * FROM kafka.clusters LIMIT 5
  - SELECT * FROM kafka.topics WHERE cluster_name = 'local' LIMIT 5

tables:
  - name: clusters
    description: Kafka clusters registered in Kafka UI.
    guide: >
      Start here to discover cluster names. The cluster_name column is the
      value required by all other tables as a required filter. Status will be
      "online", "offline", or "initializing".
    request:
      method: GET
      path: /api/clusters
    response:
      row_strategy: direct
    pagination:
      mode: none
    columns:
      - name: cluster_name
        type: Utf8
        nullable: false
        description: Cluster name as configured in Kafka UI.
        expr: {kind: path, path: [name]}
      - name: status
        type: Utf8
        nullable: true
        description: Cluster connectivity status (online, offline, initializing).
        expr: {kind: path, path: [status]}
      - name: broker_count
        type: Int64
        nullable: true
        description: Number of brokers in the cluster.
        expr: {kind: path, path: [brokerCount]}
      - name: online_partition_count
        type: Int64
        nullable: true
        description: Number of online partitions.
        expr: {kind: path, path: [onlinePartitionCount]}
      - name: topic_count
        type: Int64
        nullable: true
        description: Number of topics in the cluster.
        expr: {kind: path, path: [topicCount]}
      - name: bytes_in_per_sec
        type: Float64
        nullable: true
        description: Incoming bytes per second across the cluster.
        expr: {kind: path, path: [bytesInPerSec]}
      - name: bytes_out_per_sec
        type: Float64
        nullable: true
        description: Outgoing bytes per second across the cluster.
        expr: {kind: path, path: [bytesOutPerSec]}
      - name: version
        type: Utf8
        nullable: true
        description: Kafka broker version string.
        expr: {kind: path, path: [version]}
      - name: read_only
        type: Boolean
        nullable: true
        description: Whether the cluster is configured as read-only in Kafka UI.
        expr: {kind: path, path: [readOnly]}

  - name: brokers
    description: Brokers in a Kafka cluster.
    guide: >
      Requires cluster_name filter. Use cluster names from the clusters table.
      Each row is one broker. The id column is the Kafka broker ID. Use
      bytes_in_per_sec and bytes_out_per_sec to spot throughput imbalances
      across brokers.
    filters:
      - name: cluster_name
        required: true
    request:
      method: GET
      path: /api/clusters/{{filter.cluster_name}}/brokers
    response:
      row_strategy: direct
    pagination:
      mode: none
    columns:
      - name: id
        type: Int64
        nullable: false
        description: Kafka broker ID.
        expr: {kind: path, path: [id]}
      - name: host
        type: Utf8
        nullable: true
        description: Broker hostname.
        expr: {kind: path, path: [host]}
      - name: port
        type: Int64
        nullable: true
        description: Broker port.
        expr: {kind: path, path: [port]}
      - name: partitions_leader
        type: Int64
        nullable: true
        description: Number of partitions for which this broker is the leader.
        expr: {kind: path, path: [partitionsLeader]}
      - name: partitions
        type: Int64
        nullable: true
        description: Total number of partitions assigned to this broker.
        expr: {kind: path, path: [partitions]}
      - name: in_sync_partitions
        type: Int64
        nullable: true
        description: Number of in-sync replica partitions on this broker.
        expr: {kind: path, path: [inSyncPartitions]}
      - name: bytes_in_per_sec
        type: Float64
        nullable: true
        description: Incoming bytes per second for this broker.
        expr: {kind: path, path: [bytesInPerSec]}
      - name: bytes_out_per_sec
        type: Float64
        nullable: true
        description: Outgoing bytes per second for this broker.
        expr: {kind: path, path: [bytesOutPerSec]}
      - name: partitions_skew
        type: Float64
        nullable: true
        description: Partition count skew relative to the cluster average.
        expr: {kind: path, path: [partitionsSkew]}
      - name: leaders_skew
        type: Float64
        nullable: true
        description: Leader count skew relative to the cluster average.
        expr: {kind: path, path: [leadersSkew]}
      - name: cluster_name
        type: Utf8
        nullable: true
        description: Cluster name (echoes the cluster_name filter).
        expr: {kind: from_filter, key: cluster_name}
        virtual: true

  - name: topics
    description: Topics in a Kafka cluster.
    guide: >
      Requires cluster_name filter. Use cluster names from the clusters table.
      Internal topics (prefixed with __) are excluded by default; set
      show_internal = 'true' to include them. Use the search filter for
      substring matching on topic name. The name column can be used as the
      topic_name filter in the topic_configs table.
    filters:
      - name: cluster_name
        required: true
      - name: show_internal
      - name: search
    request:
      method: GET
      path: /api/clusters/{{filter.cluster_name}}/topics
      query:
        - name: showInternal
          from: filter
          key: show_internal
        - name: search
          from: filter
          key: search
        - name: perPage
          from: literal
          value: "1000"
    response:
      rows_path: [topics]
    pagination:
      mode: none
    columns:
      - name: name
        type: Utf8
        nullable: false
        description: Topic name. Use as the topic_name filter in topic_configs.
        expr: {kind: path, path: [name]}
      - name: internal
        type: Boolean
        nullable: true
        description: Whether this is an internal Kafka topic (e.g. __consumer_offsets).
        expr: {kind: path, path: [internal]}
      - name: partition_count
        type: Int64
        nullable: true
        description: Number of partitions.
        expr: {kind: path, path: [partitionCount]}
      - name: replication_factor
        type: Int64
        nullable: true
        description: Replication factor.
        expr: {kind: path, path: [replicationFactor]}
      - name: replicas
        type: Int64
        nullable: true
        description: Total replica count across all partitions.
        expr: {kind: path, path: [replicas]}
      - name: in_sync_replicas
        type: Int64
        nullable: true
        description: Number of in-sync replicas.
        expr: {kind: path, path: [inSyncReplicas]}
      - name: under_replicated_partitions
        type: Int64
        nullable: true
        description: Number of under-replicated partitions. Non-zero values indicate replication lag.
        expr: {kind: path, path: [underReplicatedPartitions]}
      - name: segment_size
        type: Int64
        nullable: true
        description: Total segment size in bytes.
        expr: {kind: path, path: [segmentSize]}
      - name: segment_count
        type: Int64
        nullable: true
        description: Number of log segments.
        expr: {kind: path, path: [segmentCount]}
      - name: bytes_in_per_sec
        type: Float64
        nullable: true
        description: Incoming bytes per second for this topic.
        expr: {kind: path, path: [bytesInPerSec]}
      - name: bytes_out_per_sec
        type: Float64
        nullable: true
        description: Outgoing bytes per second for this topic.
        expr: {kind: path, path: [bytesOutPerSec]}
      - name: clean_up_policy
        type: Utf8
        nullable: true
        description: Log cleanup policy (delete, compact, compact_delete).
        expr: {kind: path, path: [cleanUpPolicy]}
      - name: cluster_name
        type: Utf8
        nullable: true
        description: Cluster name (echoes the cluster_name filter).
        expr: {kind: from_filter, key: cluster_name}
        virtual: true

  - name: topic_configs
    description: Configuration key-value pairs for a specific Kafka topic.
    guide: >
      Requires cluster_name and topic_name filters. Use topic names from the
      topics table. Each row is one configuration entry. The source column
      indicates where the value comes from (DEFAULT_CONFIG,
      DYNAMIC_TOPIC_CONFIG, etc.). Sensitive values are masked by Kafka UI.
    filters:
      - name: cluster_name
        required: true
      - name: topic_name
        required: true
    request:
      method: GET
      path: /api/clusters/{{filter.cluster_name}}/topics/{{filter.topic_name}}/config
    response:
      row_strategy: direct
    pagination:
      mode: none
    columns:
      - name: name
        type: Utf8
        nullable: false
        description: Configuration key name (e.g. retention.ms, cleanup.policy).
        expr: {kind: path, path: [name]}
      - name: value
        type: Utf8
        nullable: true
        description: Current configuration value.
        expr: {kind: path, path: [value]}
      - name: default_value
        type: Utf8
        nullable: true
        description: Default value for this configuration key.
        expr: {kind: path, path: [defaultValue]}
      - name: source
        type: Utf8
        nullable: true
        description: Configuration source (DEFAULT_CONFIG, DYNAMIC_TOPIC_CONFIG, STATIC_BROKER_CONFIG, etc.).
        expr: {kind: path, path: [source]}
      - name: is_sensitive
        type: Boolean
        nullable: true
        description: Whether the value is sensitive and masked.
        expr: {kind: path, path: [isSensitive]}
      - name: is_read_only
        type: Boolean
        nullable: true
        description: Whether the configuration is read-only.
        expr: {kind: path, path: [isReadOnly]}
      - name: topic_name
        type: Utf8
        nullable: true
        description: Topic name (echoes the topic_name filter).
        expr: {kind: from_filter, key: topic_name}
        virtual: true
      - name: cluster_name
        type: Utf8
        nullable: true
        description: Cluster name (echoes the cluster_name filter).
        expr: {kind: from_filter, key: cluster_name}
        virtual: true

  - name: consumer_groups
    description: Consumer groups in a Kafka cluster.
    guide: >
      Requires cluster_name filter. Each row is one consumer group. The
      consumer_lag column is the total message lag across all partitions
      assigned to the group; null means no offsets have been committed yet.
      Use the group_id column as the group_id filter in consumer_group_offsets
      to inspect per-partition lag.
    filters:
      - name: cluster_name
        required: true
      - name: search
    request:
      method: GET
      path: /api/clusters/{{filter.cluster_name}}/consumer-groups/paged
      query:
        - name: search
          from: filter
          key: search
        - name: perPage
          from: literal
          value: "1000"
    response:
      rows_path: [consumerGroups]
    pagination:
      mode: none
    columns:
      - name: group_id
        type: Utf8
        nullable: false
        description: Consumer group ID. Use as the group_id filter in consumer_group_offsets.
        expr: {kind: path, path: [groupId]}
      - name: members
        type: Int64
        nullable: true
        description: Number of active members in the group.
        expr: {kind: path, path: [members]}
      - name: topics
        type: Int64
        nullable: true
        description: Number of topics the group is subscribed to.
        expr: {kind: path, path: [topics]}
      - name: state
        type: Utf8
        nullable: true
        description: Group state (STABLE, EMPTY, DEAD, PREPARING_REBALANCE, COMPLETING_REBALANCE, UNKNOWN).
        expr: {kind: path, path: [state]}
      - name: consumer_lag
        type: Int64
        nullable: true
        description: Total message lag across all assigned partitions. Null if no offsets committed.
        expr: {kind: path, path: [consumerLag]}
      - name: partition_assignor
        type: Utf8
        nullable: true
        description: Partition assignment strategy used by the group.
        expr: {kind: path, path: [partitionAssignor]}
      - name: simple
        type: Boolean
        nullable: true
        description: Whether this is a simple (non-coordinated) consumer group.
        expr: {kind: path, path: [simple]}
      - name: coordinator_id
        type: Int64
        nullable: true
        description: Broker ID of the group coordinator.
        expr: {kind: path, path: [coordinator, id]}
      - name: cluster_name
        type: Utf8
        nullable: true
        description: Cluster name (echoes the cluster_name filter).
        expr: {kind: from_filter, key: cluster_name}
        virtual: true

  - name: consumer_group_offsets
    description: Per-partition offset and lag details for a specific consumer group.
    guide: >
      Requires cluster_name and group_id filters. Use group IDs from the
      consumer_groups table. Each row is one topic-partition assignment.
      consumer_lag is the difference between end_offset and current_offset;
      null means no offset has been committed for that partition yet.
    filters:
      - name: cluster_name
        required: true
      - name: group_id
        required: true
    request:
      method: GET
      path: /api/clusters/{{filter.cluster_name}}/consumer-groups/{{filter.group_id}}
    response:
      rows_path: [partitions]
    pagination:
      mode: none
    columns:
      - name: topic
        type: Utf8
        nullable: false
        description: Topic name for this partition assignment.
        expr: {kind: path, path: [topic]}
      - name: partition
        type: Int64
        nullable: false
        description: Partition number.
        expr: {kind: path, path: [partition]}
      - name: current_offset
        type: Int64
        nullable: true
        description: Last committed offset for this partition.
        expr: {kind: path, path: [currentOffset]}
      - name: end_offset
        type: Int64
        nullable: true
        description: Latest available offset (high watermark) for this partition.
        expr: {kind: path, path: [endOffset]}
      - name: consumer_lag
        type: Int64
        nullable: true
        description: Messages behind (end_offset - current_offset). Null if no offset committed.
        expr: {kind: path, path: [consumerLag]}
      - name: consumer_id
        type: Utf8
        nullable: true
        description: ID of the consumer instance assigned to this partition.
        expr: {kind: path, path: [consumerId]}
      - name: host
        type: Utf8
        nullable: true
        description: Host of the consumer instance assigned to this partition.
        expr: {kind: path, path: [host]}
      - name: group_id
        type: Utf8
        nullable: true
        description: Consumer group ID (echoes the group_id filter).
        expr: {kind: from_filter, key: group_id}
        virtual: true
      - name: cluster_name
        type: Utf8
        nullable: true
        description: Cluster name (echoes the cluster_name filter).
        expr: {kind: from_filter, key: cluster_name}
        virtual: true
