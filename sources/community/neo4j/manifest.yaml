name: neo4j
version: 0.1.0
dsl_version: 3
backend: http
description: >-
  Query nodes, relationships, indexes, and constraints from Neo4j graph
  databases via the HTTP transactional API (self-hosted or Aura).

inputs:
  NEO4J_URL:
    kind: variable
    default: http://localhost:7474
    hint: |
      Base URL of your Neo4j HTTP interface, including scheme and port.
      Default is `http://localhost:7474` for a local instance.
      For Neo4j Aura use `https://<instance>.databases.neo4j.io`.
      Do not include a trailing slash.
  NEO4J_USERNAME:
    kind: variable
    default: neo4j
    hint: |
      Neo4j username. Defaults to `neo4j`. The user needs read access
      to the target database.
  NEO4J_PASSWORD:
    kind: secret
    hint: |
      Password for the Neo4j user. Set via `NEO4J_AUTH=neo4j/<password>`
      when running with Docker, for example `NEO4J_AUTH=neo4j/password`.

base_url: "{{input.NEO4J_URL}}"

auth:
  type: BasicAuth
  username: "{{input.NEO4J_USERNAME}}"
  password: "{{input.NEO4J_PASSWORD}}"

test_queries:
  - SELECT * FROM neo4j.node_labels LIMIT 5
  - SELECT * FROM neo4j.users LIMIT 5

tables:
  - name: node_labels
    description: Node labels defined in the Neo4j database.
    guide: >
      Returns one row per node label. Use label values from this table
      to understand the graph schema before querying node tables.
      No filter required.
    request:
      method: POST
      path: /db/neo4j/tx/commit
      headers:
        - name: Content-Type
          from: literal
          value: application/json
        - name: Accept
          from: literal
          value: application/json
      body:
        format: text
        content:
          from: literal
          value: |-
            {"statements":[{"statement":"MATCH (n) UNWIND labels(n) AS l WITH DISTINCT l ORDER BY l RETURN {rows:collect({label:l})} AS x"}]}
    response:
      rows_path: [results, "0", data, "0", row, "0", rows]
    pagination:
      mode: none
    columns:
      - name: label
        type: Utf8
        nullable: false
        description: Node label name.
        expr: {kind: path, path: [label]}

  - name: relationship_types
    description: Relationship types defined in the Neo4j database.
    guide: >
      Returns one row per relationship type. Use these values to understand
      the graph topology before querying the relationships table.
      No filter required.
    request:
      method: POST
      path: /db/neo4j/tx/commit
      headers:
        - name: Content-Type
          from: literal
          value: application/json
        - name: Accept
          from: literal
          value: application/json
      body:
        format: text
        content:
          from: literal
          value: |-
            {"statements":[{"statement":"MATCH ()-[r]->() WITH DISTINCT type(r) AS t ORDER BY t RETURN {rows:collect({t:t})} AS x"}]}
    response:
      rows_path: [results, "0", data, "0", row, "0", rows]
    pagination:
      mode: none
    columns:
      - name: relationship_type
        type: Utf8
        nullable: false
        description: Relationship type name.
        expr: {kind: path, path: [t]}

  - name: users
    description: User nodes in the Neo4j graph.
    guide: >
      Returns all nodes with the User label. Each row has id, name, and email.
      No filter required.
    request:
      method: POST
      path: /db/neo4j/tx/commit
      headers:
        - name: Content-Type
          from: literal
          value: application/json
        - name: Accept
          from: literal
          value: application/json
      body:
        format: text
        content:
          from: literal
          value: |-
            {"statements":[{"statement":"MATCH (n:User) RETURN {rows:collect({id:n.id,name:n.name,email:n.email})} AS x"}]}
    response:
      rows_path: [results, "0", data, "0", row, "0", rows]
    pagination:
      mode: none
    columns:
      - name: id
        type: Int64
        nullable: false
        description: User node ID.
        expr: {kind: path, path: [id]}
      - name: name
        type: Utf8
        nullable: true
        description: User display name.
        expr: {kind: path, path: [name]}
      - name: email
        type: Utf8
        nullable: true
        description: User email address.
        expr: {kind: path, path: [email]}

  - name: organizations
    description: Organization nodes in the Neo4j graph.
    guide: >
      Returns all nodes with the Organization label. Each row has id and name.
      No filter required.
    request:
      method: POST
      path: /db/neo4j/tx/commit
      headers:
        - name: Content-Type
          from: literal
          value: application/json
        - name: Accept
          from: literal
          value: application/json
      body:
        format: text
        content:
          from: literal
          value: |-
            {"statements":[{"statement":"MATCH (n:Organization) RETURN {rows:collect({id:n.id,name:n.name})} AS x"}]}
    response:
      rows_path: [results, "0", data, "0", row, "0", rows]
    pagination:
      mode: none
    columns:
      - name: id
        type: Int64
        nullable: false
        description: Organization node ID.
        expr: {kind: path, path: [id]}
      - name: name
        type: Utf8
        nullable: true
        description: Organization name.
        expr: {kind: path, path: [name]}

  - name: products
    description: Product nodes in the Neo4j graph.
    guide: >
      Returns all nodes with the Product label. Each row has id, name, and
      category. No filter required.
    request:
      method: POST
      path: /db/neo4j/tx/commit
      headers:
        - name: Content-Type
          from: literal
          value: application/json
        - name: Accept
          from: literal
          value: application/json
      body:
        format: text
        content:
          from: literal
          value: |-
            {"statements":[{"statement":"MATCH (n:Product) RETURN {rows:collect({id:n.id,name:n.name,category:n.category})} AS x"}]}
    response:
      rows_path: [results, "0", data, "0", row, "0", rows]
    pagination:
      mode: none
    columns:
      - name: id
        type: Int64
        nullable: false
        description: Product node ID.
        expr: {kind: path, path: [id]}
      - name: name
        type: Utf8
        nullable: true
        description: Product name.
        expr: {kind: path, path: [name]}
      - name: category
        type: Utf8
        nullable: true
        description: Product category (e.g. GPU, Laptop, VR).
        expr: {kind: path, path: [category]}

  - name: orders
    description: Order nodes in the Neo4j graph.
    guide: >
      Returns all nodes with the Order label. Each row has id and total.
      Join with relationships to see which users placed orders and which
      products they contain.
    request:
      method: POST
      path: /db/neo4j/tx/commit
      headers:
        - name: Content-Type
          from: literal
          value: application/json
        - name: Accept
          from: literal
          value: application/json
      body:
        format: text
        content:
          from: literal
          value: |-
            {"statements":[{"statement":"MATCH (n:Order) RETURN {rows:collect({id:n.id,total:n.total})} AS x"}]}
    response:
      rows_path: [results, "0", data, "0", row, "0", rows]
    pagination:
      mode: none
    columns:
      - name: id
        type: Int64
        nullable: false
        description: Order node ID.
        expr: {kind: path, path: [id]}
      - name: total
        type: Float64
        nullable: true
        description: Order total value.
        expr: {kind: path, path: [total]}

  - name: technologies
    description: Technology nodes in the Neo4j graph.
    guide: >
      Returns all nodes with the Technology label. Each row has a name.
      No filter required.
    request:
      method: POST
      path: /db/neo4j/tx/commit
      headers:
        - name: Content-Type
          from: literal
          value: application/json
        - name: Accept
          from: literal
          value: application/json
      body:
        format: text
        content:
          from: literal
          value: |-
            {"statements":[{"statement":"MATCH (n:Technology) RETURN {rows:collect({name:n.name})} AS x"}]}
    response:
      rows_path: [results, "0", data, "0", row, "0", rows]
    pagination:
      mode: none
    columns:
      - name: name
        type: Utf8
        nullable: false
        description: Technology name.
        expr: {kind: path, path: [name]}

  - name: relationships
    description: All relationships in the Neo4j graph with source and target node info.
    guide: >
      Returns all relationships with from_label, from_id, rel_type, to_label,
      and to_id. Filter by rel_type in SQL (e.g. WHERE rel_type = 'WORKS_AT').
      from_id and to_id are the raw integer id property of the source and
      target nodes.
    request:
      method: POST
      path: /db/neo4j/tx/commit
      headers:
        - name: Content-Type
          from: literal
          value: application/json
        - name: Accept
          from: literal
          value: application/json
      body:
        format: text
        content:
          from: literal
          value: |-
            {"statements":[{"statement":"MATCH (a)-[r]->(b) RETURN {rows:collect({fl:labels(a)[0],fi:a.id,rt:type(r),tl:labels(b)[0],ti:b.id})}"}]}
    response:
      rows_path: [results, "0", data, "0", row, "0", rows]
    pagination:
      mode: none
    columns:
      - name: from_label
        type: Utf8
        nullable: true
        description: Label of the source node.
        expr: {kind: path, path: [fl]}
      - name: from_id
        type: Int64
        nullable: true
        description: ID property of the source node.
        expr: {kind: path, path: [fi]}
      - name: rel_type
        type: Utf8
        nullable: false
        description: Relationship type (e.g. WORKS_AT, PLACED, CONTAINS, USES).
        expr: {kind: path, path: [rt]}
      - name: to_label
        type: Utf8
        nullable: true
        description: Label of the target node.
        expr: {kind: path, path: [tl]}
      - name: to_id
        type: Int64
        nullable: true
        description: ID property of the target node.
        expr: {kind: path, path: [ti]}

  - name: indexes
    description: Indexes defined in the Neo4j database.
    guide: >
      Returns all indexes including LOOKUP, RANGE, TEXT, and POINT types.
      The labels_or_types column contains the node label or relationship type
      the index applies to. The properties column lists the indexed properties.
      No filter required.
    request:
      method: POST
      path: /db/neo4j/tx/commit
      headers:
        - name: Content-Type
          from: literal
          value: application/json
        - name: Accept
          from: literal
          value: application/json
      body:
        format: text
        content:
          from: literal
          value: >-
            {"statements":[{"statement":"SHOW INDEXES YIELD name,type,state,labelsOrTypes AS lt,properties AS pr,entityType AS et
            RETURN {rows:collect({n:name,tp:type,s:state,lt:lt,pr:pr,et:et})}"}]}
    response:
      rows_path: [results, "0", data, "0", row, "0", rows]
    pagination:
      mode: none
    columns:
      - name: name
        type: Utf8
        nullable: false
        description: Index name.
        expr: {kind: path, path: [n]}
      - name: type
        type: Utf8
        nullable: true
        description: Index type (LOOKUP, RANGE, TEXT, POINT, FULLTEXT).
        expr: {kind: path, path: [tp]}
      - name: state
        type: Utf8
        nullable: true
        description: Index state (ONLINE, POPULATING, FAILED).
        expr: {kind: path, path: [s]}
      - name: entity_type
        type: Utf8
        nullable: true
        description: Entity type the index applies to (NODE or RELATIONSHIP).
        expr: {kind: path, path: [et]}
      - name: labels_or_types
        type: Json
        nullable: true
        description: Node labels or relationship types covered by the index.
        expr: {kind: path, path: [lt]}
      - name: properties
        type: Json
        nullable: true
        description: Properties covered by the index.
        expr: {kind: path, path: [pr]}

  - name: constraints
    description: Constraints defined in the Neo4j database.
    guide: >
      Returns all constraints including uniqueness and existence constraints.
      The labels_or_types column contains the node label or relationship type
      the constraint applies to. The properties column lists the constrained
      properties. No filter required.
    request:
      method: POST
      path: /db/neo4j/tx/commit
      headers:
        - name: Content-Type
          from: literal
          value: application/json
        - name: Accept
          from: literal
          value: application/json
      body:
        format: text
        content:
          from: literal
          value: >-
            {"statements":[{"statement":"SHOW CONSTRAINTS YIELD name,type,entityType AS et,labelsOrTypes AS lt,properties AS pr
            RETURN {rows:collect({n:name,tp:type,et:et,lt:lt,pr:pr})}"}]}
    response:
      rows_path: [results, "0", data, "0", row, "0", rows]
    pagination:
      mode: none
    columns:
      - name: name
        type: Utf8
        nullable: false
        description: Constraint name.
        expr: {kind: path, path: [n]}
      - name: type
        type: Utf8
        nullable: true
        description: Constraint type (e.g. NODE_PROPERTY_UNIQUENESS, NODE_PROPERTY_EXISTENCE).
        expr: {kind: path, path: [tp]}
      - name: entity_type
        type: Utf8
        nullable: true
        description: Entity type the constraint applies to (NODE or RELATIONSHIP).
        expr: {kind: path, path: [et]}
      - name: labels_or_types
        type: Json
        nullable: true
        description: Node labels or relationship types covered by the constraint.
        expr: {kind: path, path: [lt]}
      - name: properties
        type: Json
        nullable: true
        description: Properties covered by the constraint.
        expr: {kind: path, path: [pr]}
